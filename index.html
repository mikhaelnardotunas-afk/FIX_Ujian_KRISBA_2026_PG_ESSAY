<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5BC0F0">
  <title>Siber Ujian Gemini V2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@600;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --sky-top: #4FB8F0;
      --sky-bot: #CFF0FF;
      --red: #E5322D;
      --yellow: #FFD21F;
      --cream: #FFF3C4;
      --grass: #7ACB3B;
      --grass-dark: #4E9A22;
      --dirt: #8A5A2B;
      --wood: #D9953B;
      --wood-dark: #5A3213;
      --wood-deep: #3A1F0B;
      --stone: #B9C0C8;
      --stone-dark: #4A525B;
      --ice: #9FE3FF;
      --ice-dark: #2F7FA3;
      --display: 'Lilita One', 'Impact', 'Arial Black', sans-serif;
      --body: 'Baloo 2', 'Trebuchet MS', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      height: 100%
    }

    body {
      font-family: var(--body);
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 70%);
      color: #fff;
      overflow-x: hidden;
    }

    /* ---------- Langit ---------- */
    .sky {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0
    }

    .sun {
      position: absolute;
      top: -70px;
      right: -70px;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, #FFF6A8 0 35%, #FFE45C 36% 60%, rgba(255, 228, 92, .35) 61% 100%);
    }

    .cloud {
      position: absolute;
      width: 150px;
      opacity: .95;
      animation: drift linear infinite
    }

    .cloud.c1 {
      top: 9%;
      left: -180px;
      animation-duration: 60s
    }

    .cloud.c2 {
      top: 26%;
      left: -180px;
      width: 110px;
      animation-duration: 85s;
      animation-delay: -30s
    }

    .cloud.c3 {
      top: 45%;
      left: -180px;
      width: 130px;
      animation-duration: 70s;
      animation-delay: -55s;
      opacity: .8
    }

    @keyframes drift {
      to {
        transform: translateX(calc(100vw + 400px))
      }
    }

    /* ---------- Layout ---------- */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(18px, env(safe-area-inset-top)) 18px 0;
    }

    header {
      text-align: center;
      width: 100%;
      max-width: 520px;
      margin-top: 6px
    }

    .logo-birds {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 2px;
      height: 84px
    }

    .logo-birds svg {
      width: 72px;
      height: 72px;
      filter: drop-shadow(0 5px 0 rgba(0, 0, 0, .18))
    }

    .logo-birds .b-yellow {
      width: 58px;
      height: 58px;
      transform: rotate(12deg)
    }

    .logo-birds .b-red {
      animation: hop 1.1s ease-in-out 0.4s 2
    }

    @keyframes hop {

      0%,
      100% {
        transform: translateY(0)
      }

      40% {
        transform: translateY(-18px) rotate(-6deg)
      }
    }

    h1 {
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(2.8rem, 15vw, 5rem);
      line-height: .95;
      letter-spacing: 1px;
      color: var(--cream);
      -webkit-text-stroke: 11px #5C1A10;
      paint-order: stroke fill;
      text-shadow: 0 8px 0 #5C1A10, 0 14px 18px rgba(0, 0, 0, .3);
      transform: rotate(-3deg);
      margin-top: 2px;
    }

    .tagline {
      display: inline-block;
      margin-top: 18px;
      padding: 3px 18px 5px;
      background: var(--red);
      border: 4px solid #7A1410;
      border-radius: 999px;
      font-family: var(--display);
      font-size: 1.05rem;
      letter-spacing: .5px;
      box-shadow: 0 4px 0 #7A1410;
      text-shadow: 1px 2px 0 #7A1410;
    }

    /* ---------- Tombol papan kayu ---------- */
    nav {
      width: 100%;
      max-width: 440px;
      margin: 26px 0 30px;
      display: flex;
      flex-direction: column;
      gap: 20px
    }

    .plank {
      --c1: var(--wood);
      --c2: #C47F26;
      --edge: var(--wood-dark);
      --deep: var(--wood-deep);
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px 14px 14px;
      min-height: 84px;
      border-radius: 18px;
      border: 5px solid var(--edge);
      background:
        repeating-linear-gradient(90deg, rgba(0, 0, 0, 0) 0 38px, rgba(0, 0, 0, .07) 38px 41px),
        repeating-linear-gradient(0deg, var(--c1) 0 14px, var(--c2) 14px 17px);
      box-shadow: 0 8px 0 var(--deep), 0 16px 18px rgba(0, 0, 0, .28);
      color: #fff;
      text-decoration: none;
      transition: transform .12s ease, box-shadow .12s ease;
    }

    .plank::before,
    .plank::after {
      /* baut */
      content: "";
      position: absolute;
      top: 50%;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #eee, #8a8a8a);
      border: 2px solid var(--deep);
      transform: translateY(-50%);
    }

    .plank::before {
      left: 5px;
      top: 12px;
      transform: none
    }

    .plank::after {
      right: 6px;
      bottom: 12px;
      top: auto;
      transform: none
    }

    .plank:nth-child(3n+2) {
      --c1: var(--stone);
      --c2: #A5ADB6;
      --edge: var(--stone-dark);
      --deep: #2E343A
    }

    .plank:nth-child(3n) {
      --c1: var(--ice);
      --c2: #86D6F7;
      --edge: var(--ice-dark);
      --deep: #1C556F
    }

    .plank.install-btn {
      --c1: var(--grass);
      --c2: #8ED84B;
      --edge: var(--grass-dark);
      --deep: #2D6110
    }

    .plank:hover {
      transform: translateY(-4px) rotate(-.8deg);
      box-shadow: 0 12px 0 var(--deep), 0 22px 22px rgba(0, 0, 0, .28)
    }

    .plank:active {
      transform: translateY(7px);
      box-shadow: 0 1px 0 var(--deep), 0 4px 8px rgba(0, 0, 0, .3)
    }

    .plank:focus-visible {
      outline: 5px solid var(--yellow);
      outline-offset: 4px
    }

    .ico {
      flex: none;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 1.9rem;
      background: var(--cream);
      border: 4px solid var(--deep);
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .12);
    }

    .txt {
      display: flex;
      flex-direction: column;
      line-height: 1.05;
      min-width: 0
    }

    .txt b {
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(1.55rem, 7.5vw, 2rem);
      text-shadow: 2px 3px 0 var(--deep);
      letter-spacing: .5px;
    }

    .txt small {
      font-family: var(--body);
      font-weight: 600;
      font-size: .95rem;
      margin-top: 3px;
      text-shadow: 1px 2px 0 var(--deep);
    }

    /* Utils */
    .hidden {
      display: none !important;
    }

    /* ---------- Pemandangan bawah ---------- */
    .ground {
      margin-top: auto;
      width: calc(100% + 36px);
      margin-left: -18px;
      position: relative;
      line-height: 0;
    }

    .ground svg {
      width: 100%;
      height: auto;
      display: block
    }

    .ground .dirt {
      height: max(26px, env(safe-area-inset-bottom));
      background: var(--dirt);
      margin-top: -1px
    }

    .pig-wobble {
      transform-origin: 290px 180px;
      animation: wobble 2.6s ease-in-out infinite
    }

    @keyframes wobble {

      0%,
      100% {
        transform: rotate(0)
      }

      50% {
        transform: rotate(-2deg)
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }

    @media (min-width:700px) {
      nav {
        max-width: 480px
      }

      .logo-birds {
        height: 96px
      }

      .logo-birds svg {
        width: 84px;
        height: 84px
      }
    }
  </style>
</head>

  <!-- SCRIPT UNTUK INSTALASI PWA (Tombol Install) -->
  <script>
    let deferredPrompt;
    const btnInstall = document.getElementById('btnInstall');

    // Mendengarkan event dari browser jika aplikasi siap diinstal
    window.addEventListener('beforeinstallprompt', (e) => {
      // Mencegah mini-infobar default muncul di HP
      e.preventDefault();
      // Simpan event sehingga bisa dipicu nanti lewat tombol
      deferredPrompt = e;
      // Munculkan tombol Install di menu
      btnInstall.classList.remove('hidden');
    });

    // Saat tombol Install diklik
    btnInstall.addEventListener('click', async (e) => {
      e.preventDefault();
      // Sembunyikan tombol setelah diklik
      btnInstall.classList.add('hidden');
      // Munculkan prompt instalasi bawaan browser
      deferredPrompt.prompt();
      // Tunggu pilihan user (apakah memilih Install atau Batal)
      const { outcome } = await deferredPrompt.userChoice;
      console.log(`Pilihan instalasi: ${outcome}`);
      // Bersihkan prompt event
      deferredPrompt = null;
    });

    // Sembunyikan tombol secara otomatis jika aplikasi telah terinstal
    window.addEventListener('appinstalled', () => {
      btnInstall.classList.add('hidden');
      deferredPrompt = null;
      console.log('Aplikasi berhasil dipasang di perangkat');
    });
  </script>

  <!-- Daftarkan Service Worker (Agar PWA berfungsi & Install terpicu) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => {
            console.log('Service Worker terdaftar!', reg);

            // Paksa periksa update di latar belakang tiap kali halaman dibuka
            reg.update();

            // Jika ada versi baru di GitHub, otomatis muat ulang halaman saat siswa membuka
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('Versi baru ditemukan, memuat ulang halaman...');
                  window.location.reload(true);
                }
              });
            });
          })
          .catch(err => console.log('Service Worker gagal', err));
      });
    }
  </script>
